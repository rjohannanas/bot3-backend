name: Despliegue a Cloud Run (Agentic RAG)

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: servicios-492716
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/servicios-492716/agentic-rag/agentic-rag:latest
  SERVICE_NAME: agentic-rag
  BUCKET_NAME: recs-chb-seteloee

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Descargar el código
        uses: actions/checkout@v4

      - name: 🔐 Autenticarse en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: ⚙️ Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🏗️ Construir imagen Docker en GCP
        run: |
          gcloud builds submit --tag ${{ env.IMAGE }} --project=${{ env.PROJECT_ID }}

      - name: 🚀 Desplegar en Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --memory 4Gi \
            --cpu 4 \
            --timeout 300 \
            --min-instances 1 \
            --max-instances 5 \
            --concurrency 10 \
            --set-env-vars QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }} \
            --set-env-vars QDRANT_URL=${{ secrets.QDRANT_URL }} \
            --set-env-vars PARENT_STORE_PATH=/app/data/parent_store \
            --set-env-vars MARKDOWN_DIR=/app/data/markdown_docs \
            --set-env-vars PDF_DIR=/app/data/pdf_docs \
            --set-env-vars ENABLE_GRADIO_UI=true \
            --set-env-vars DB_USER=${{ secrets.DB_USER }} \
            --set-env-vars DB_PASS=${{ secrets.DB_PASS }} \
            --set-env-vars DB_NAME=${{ secrets.DB_NAME }} \
            --set-env-vars INSTANCE_CONNECTION_NAME=${{ secrets.INSTANCE_CONNECTION_NAME }} \
            --set-env-vars FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --add-volume name=gcs-data,type=cloud-storage,bucket=${{ env.BUCKET_NAME }} \
            --add-volume-mount volume=gcs-data,mount-path=/app/data \
            --startup-probe httpGet.path=/health,initialDelaySeconds=5,timeoutSeconds=10,periodSeconds=10,failureThreshold=20 \
            --allow-unauthenticated
